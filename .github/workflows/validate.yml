name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional docx test dependency
        run: python -m pip install --disable-pip-version-check python-docx
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline eval prompt-set check
        run: python evals/run_eval.py --dry-run
